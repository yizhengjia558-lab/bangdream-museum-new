name = "bangdream-museum-analytics"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 首次部署前执行:
#   npx wrangler kv namespace create STATS
# 将输出的 id 填入下方 id 字段。
[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 可选: 限制哪些站点域名可以上报（逗号分隔，留空则允许全部）
# [vars]
# ALLOWED_ORIGINS = "https://yizhengjia558-lab.github.io,http://localhost:3000"

# 可选: 设置后 /stats?token=xxx 可查看 30 日趋势与热门页面
# 在 Cloudflare Dashboard → Workers → Settings → Variables 中添加 STATS_SECRET
