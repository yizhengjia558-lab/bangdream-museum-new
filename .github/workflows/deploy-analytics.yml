name: Deploy Analytics Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        working-directory: web/analytics-worker
        run: npm ci

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: web/analytics-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          OUTPUT=$(npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log)
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1)
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Remind to update visitor-api.json
        run: |
          echo "Add this URL to web/public/visitor-api.json and push:"
          echo "${{ steps.deploy.outputs.worker_url }}"
