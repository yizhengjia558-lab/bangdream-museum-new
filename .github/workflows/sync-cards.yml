name: Sync new cards

on:
  schedule:
    # 每天 UTC 12:00 = 北京时间 20:00（日服维护后常见更新时间）
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync new cards from Bestdori
        run: python sync_cards.py

      - name: Commit and push if updated
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bandori sync_last_run.json \
            web/src/data/site-index.json \
            web/src/data/hero-cards.json \
            web/src/data/home-bands.json \
            web/src/data/card-enrichment.json
          if git diff --staged --quiet; then
            echo "No new cards — nothing to commit."
          else
            git commit -m "Auto-sync: update cards from Bestdori"
            git push
          fi
